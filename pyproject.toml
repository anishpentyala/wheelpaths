[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "wheelpaths"
version = "0.1.0"
description = "Offline collision plans for explicit POSIX wheel installation layouts"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
[project.scripts]
wheelpaths = "wheelpaths.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
